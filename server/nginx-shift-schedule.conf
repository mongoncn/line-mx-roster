# HTTP：仅接收域名并 301 跳 HTTPS，其余（含 IP 直连）一律断开
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name shift.example.com;
    return 301 https://$host$request_uri;
}
# HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name shift.example.com;
    root /var/www/shift-schedule;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/nginx/ssl/shift.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/shift.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location / { try_files $uri $uri/ =404; }
    location /api/ { proxy_pass http://127.0.0.1:8023; proxy_set_header Host $host; proxy_read_timeout 15s; }
}
